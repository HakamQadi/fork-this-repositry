name: RepGuide PR QA
on:
  pull_request:
    branches: [master]

jobs:
  qa:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild and extract projects
        run: |
          cat qa/frontend.part* | base64 -d > /tmp/frontend.zip
          cat qa/backend.part* | base64 -d > /tmp/backend.zip
          unzip -t /tmp/frontend.zip
          unzip -t /tmp/backend.zip
          mkdir frontend backend
          unzip -q /tmp/frontend.zip -d frontend
          unzip -q /tmp/backend.zip -d backend
          if [ -d frontend/gym-guide-frontend ]; then shopt -s dotglob; mv frontend/gym-guide-frontend/* frontend/; rmdir frontend/gym-guide-frontend; fi
          if [ -d backend/gym-guide-backend ]; then shopt -s dotglob; mv backend/gym-guide-backend/* backend/; rmdir backend/gym-guide-backend; fi
      - name: Frontend install, checks and build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:4000/api
        run: |
          npm install
          npm run typecheck
          npm run lint
          npm run build
      - name: Backend install, tests and build
        working-directory: backend
        run: |
          npm install
          npm test -- --runInBand
          npm run build
      - name: Seed and start backend
        working-directory: backend
        env:
          PORT: 4000
          MONGODB_URI: mongodb://127.0.0.1:27017/repguide
          JWT_SECRET: qa-secret-that-is-at-least-32-characters-long
          APP_URL: http://127.0.0.1:4000
          CORS_ORIGINS: http://127.0.0.1:3000,http://localhost:3000
          ADMIN_EMAIL: admin@repguide.local
          ADMIN_PASSWORD: Admin123!
        run: |
          npm run seed
          nohup npm run start:prod > /tmp/backend.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4000/api >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:4000/api
      - name: API smoke tests
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:4000/api/categories > /tmp/categories.json
          curl -fsS 'http://127.0.0.1:4000/api/exercises?type=gym&limit=24' > /tmp/exercises.json
          node - <<'NODE'
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('/tmp/categories.json','utf8'));
          const e=JSON.parse(fs.readFileSync('/tmp/exercises.json','utf8'));
          if (!Array.isArray(c)||c.length!==7) throw new Error(`categories=${c.length}`);
          if (!e.items||e.items.length!==14||e.total!==14) throw new Error(`exercises=${e.total}`);
          NODE
          curl -fsS 'http://127.0.0.1:4000/api/exercises?q=chest&type=gym' | grep -q 'Bench Press'
          TOKEN=$(curl -fsS -X POST http://127.0.0.1:4000/api/auth/login -H 'content-type: application/json' -d '{"email":"admin@repguide.local","password":"Admin123!"}' | node -pe 'JSON.parse(fs.readFileSync(0,"utf8")).accessToken')
          test -n "$TOKEN"
          curl -fsS http://127.0.0.1:4000/api/admin/stats -H "authorization: Bearer $TOKEN"
      - name: Start frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:4000/api
        run: |
          nohup npm start > /tmp/frontend.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:3000 >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:3000 >/dev/null
      - name: Browser E2E
        run: |
          mkdir /tmp/browser && cd /tmp/browser
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          cat > e2e.js <<'NODE'
          const { chromium }=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1000}});
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:3000',{waitUntil:'networkidle'});
            await page.getByRole('heading',{name:/Find the right exercise/i}).waitFor();
            await page.getByLabel('Search exercises').fill('bench press');
            await page.waitForTimeout(600);
            await page.getByRole('link',{name:/Barbell Bench Press/i}).click();
            await page.getByRole('heading',{name:'Barbell Bench Press'}).waitFor();
            await page.goto('http://127.0.0.1:3000/login',{waitUntil:'networkidle'});
            await page.getByRole('button',{name:/Sign in to admin/i}).click();
            await page.waitForURL('**/admin');
            await page.getByText('Overview',{exact:true}).waitFor();
            await page.goto('http://127.0.0.1:3000/admin/exercises',{waitUntil:'networkidle'});
            await page.getByText('Exercises',{exact:true}).first().waitFor();
            if(errors.length) throw new Error(errors.join(' | '));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node e2e.js
      - name: Logs on failure
        if: failure()
        run: |
          echo '--- backend ---'; cat /tmp/backend.log || true
          echo '--- frontend ---'; cat /tmp/frontend.log || true
